name: db-nightly（目录库：建库、检查、从库产出 _build/ 与从文件产出逐字节比对）

# GUJI-755。上线流程仍从文件产出 _build/（用户 2026-11-05 定先不切）；这里每夜确认「随时可切」：
#   1. bim 从本仓＋book-text 全量建库（Postgres 服务容器，免费），--verify 还原比对目录四类与 book-text 五类记录 0 不一致；
#   2. schema/db/checks.sql 每条 0 行（悬空引用含 book-text 指向目录的、id_map 解不到等）；
#   3. build_derived 从文件、从库各产出一遍 _build/，每个文件 sha1 相同。
# 任何一步不过就红。只读，不发布、不写仓。
on:
  schedule:
    - cron: '0 12 * * *'      # 洛杉矶 04:00（夏令时 05:00）
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/db-nightly.yml'

permissions:
  contents: read

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: gj
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
          --shm-size 1g
    env:
      DSN: host=localhost port=5432 user=postgres password=pg dbname=gj
    steps:
      - uses: actions/checkout@v4
        with: { path: bi }
      - uses: actions/checkout@v4
        with: { repository: open-guji/book-index-manager, path: bim }
      - uses: actions/checkout@v4
        with:
          repository: open-guji/book-text
          path: bt
          # 元数据 json（manifest、版本 index.json、整理本 NNN.json、专名层、辑佚）＋ index/texts；正文 .md 不取
          sparse-checkout: |
            /*
            !*.md
            !/scripts/
          sparse-checkout-cone-mode: false
      - name: 装 psycopg
        run: pip install "psycopg[binary]"
      - name: 全量建库并还原比对
        working-directory: bim
        run: python3 -m book_index_manager.db build --root "$GITHUB_WORKSPACE/bi" --text-root "$GITHUB_WORKSPACE/bt" --dsn "$DSN" --full --verify | tee "$RUNNER_TEMP/build.log"
      - name: checks.sql 每条 0 行
        working-directory: bim
        run: |
          python3 - <<'EOF'
          import os, sys, psycopg
          sys.path.insert(0, '.')
          from book_index_manager.db.ddl import checks_sql
          bad = 0
          with psycopg.connect(os.environ['DSN']) as conn, conn.cursor() as cur:
              for q in checks_sql().splitlines():
                  if not q.startswith('SELECT'):
                      continue
                  cur.execute('SELECT count(*) FROM (%s) t' % q.rstrip(';'))
                  n = cur.fetchone()[0]
                  if n:
                      bad += 1
                      print('::error::%s → %d 行' % (q[:80], n))
          print('checks 不过 %d 条' % bad)
          sys.exit(1 if bad else 0)
          EOF
      - name: 从文件、从库各产出一遍 _build/，逐文件比对
        working-directory: bi
        run: |
          set -e
          TI="$GITHUB_WORKSPACE/bt/index/texts"
          sha() { (cd "$1" && find . -type f -print0 | sort -z | xargs -0 -n 2000 sha1sum) > "$2"; }
          python3 build/build_derived.py --out "$RUNNER_TEMP/a" --text-index "$TI" | tail -3
          sha "$RUNNER_TEMP/a" "$RUNNER_TEMP/a.sha"; rm -rf "$RUNNER_TEMP/a"
          PYTHONPATH="$GITHUB_WORKSPACE/bim" python3 build/build_derived.py --from-db "$DSN" --out "$RUNNER_TEMP/b" --text-index "$TI" | tail -3
          sha "$RUNNER_TEMP/b" "$RUNNER_TEMP/b.sha"
          echo "从文件 $(wc -l < "$RUNNER_TEMP/a.sha") 个文件，从库 $(wc -l < "$RUNNER_TEMP/b.sha") 个文件" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! diff "$RUNNER_TEMP/a.sha" "$RUNNER_TEMP/b.sha" > "$RUNNER_TEMP/diff.txt"; then
            echo "::error::从库产出与从文件产出不一致：$(grep -c '^[<>]' "$RUNNER_TEMP/diff.txt") 行差异"
            head -40 "$RUNNER_TEMP/diff.txt"
            # 诊断：留下不一致的文件（从库一份；再从文件产出一遍取另一份），并查从文件两次产出是否本身不稳定
            D="$RUNNER_TEMP/diag"; mkdir -p "$D/db" "$D/file"
            grep '^[<>]' "$RUNNER_TEMP/diff.txt" | sed 's/^. [0-9a-f]*  //' | sort -u > "$D/paths.txt"
            (cd "$RUNNER_TEMP/b" && head -200 "$D/paths.txt" | xargs -r cp --parents -t "$D/db" 2>/dev/null || true)
            rm -rf "$RUNNER_TEMP/b"
            python3 build/build_derived.py --out "$RUNNER_TEMP/a" --text-index "$TI" | tail -1
            sha "$RUNNER_TEMP/a" "$RUNNER_TEMP/a2.sha"
            echo "从文件两次产出差异：$(diff "$RUNNER_TEMP/a.sha" "$RUNNER_TEMP/a2.sha" | grep -c '^[<>]') 行（非 0 即产出本身不确定）" | tee -a "$GITHUB_STEP_SUMMARY"
            (cd "$RUNNER_TEMP/a" && head -200 "$D/paths.txt" | xargs -r cp --parents -t "$D/file" 2>/dev/null || true)
            python3 - "$D" <<'EOF'
          import json, os, sys
          D = sys.argv[1]
          shown = 0
          for p in open(os.path.join(D, 'paths.txt')).read().split():
              fa, fb = os.path.join(D, 'file', p), os.path.join(D, 'db', p)
              if not (os.path.exists(fa) and os.path.exists(fb)) or shown >= 6:
                  continue
              a, b = json.load(open(fa, encoding='utf-8')), json.load(open(fb, encoding='utf-8'))
              if isinstance(a, dict) and isinstance(b, dict):
                  ks = [k for k in sorted(set(a) | set(b)) if json.dumps(a.get(k), ensure_ascii=False) != json.dumps(b.get(k), ensure_ascii=False)]
                  print('== %s：%d 个键不同，例 %s' % (p, len(ks), ks[:5]))
                  for k in ks[:2]:
                      print('  file:', json.dumps(a.get(k), ensure_ascii=False)[:600])
                      print('  db  :', json.dumps(b.get(k), ensure_ascii=False)[:600])
              else:
                  print('== %s：非对象，长度 %s / %s' % (p, len(json.dumps(a)), len(json.dumps(b))))
              shown += 1
          EOF
            exit 1
          fi
          echo "逐字节一致" >> "$GITHUB_STEP_SUMMARY"
      - name: 上传不一致样本
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-nightly-diag
          path: ${{ runner.temp }}/diag
          if-no-files-found: ignore
          retention-days: 7
