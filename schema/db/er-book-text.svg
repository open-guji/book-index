</style><rect width="100%" height="100%" fill="#ffffff"/><text class="h" x="30" y="34">book-text（文本仓）</text><text class="h" x="800" y="34">book-index（元数据）</text><rect class="det" x="30" y="60" width="280" height="52" rx="4"/><text class="t" x="42" y="82">bt_item 文本条目</text><text class="m" x="42" y="100">路径 Work|Book/c1/c2/c3/&lt;id&gt;</text><rect class="det" x="30" y="140" width="280" height="52" rx="4"/><text class="t" x="42" y="162">bt_version 版本</text><text class="m" x="42" y="180">整理本 / 转录 / original；授权、质量</text><rect class="det" x="30" y="220" width="280" height="70" rx="4"/><text class="t" x="42" y="242">bt_chapter 章</text><text class="m" x="42" y="260">三线版本号、有哪些层、校对中</text><text class="m" x="42" y="277">附：bt_heading · bt_layer · bt_page_break</text><line class="e" x1="170" y1="112" x2="170" y2="140" marker-end="url(#a)"/><line class="e" x1="170" y1="192" x2="170" y2="220" marker-end="url(#a)"/><rect class="det" x="30" y="330" width="280" height="60" rx="4"/><text class="t" x="42" y="352">bt_section 整理本各节</text><text class="m" x="42" y="370">+ bt_section_work（多值 work_ids）</text><rect class="rel" x="30" y="430" width="280" height="64" rx="4"/><text class="t" x="42" y="452">bt_entity_span 专名</text><text class="m" x="42" y="470">每处一行：文字、格位锚点、状态</text><text class="m" x="42" y="487">matched / ambiguous / new_candidate</text><path class="e" d="M44 290 V330" marker-end="url(#a)"/><path class="e" d="M24 255 H16 V462 H30" marker-end="url(#a)"/><text class="m" x="8" y="372" transform="rotate(-90 8 372)">original 的 entity 层</text><rect class="det" x="30" y="540" width="280" height="110" rx="4"/><text class="t" x="42" y="562">fragment 辑佚</text><text class="m" x="42" y="580">fragment_piece 佚文（可检索）</text><text class="m" x="42" y="597">fragment_collector 辑者 · fragment_citation 出处</text><text class="m" x="42" y="634">fragment_based_on 据何考证</text><rect class="main" x="800" y="60" width="270" height="52" rx="4"/><text class="t" x="812" y="82">work 作品</text><rect class="main" x="800" y="160" width="270" height="52" rx="4"/><text class="t" x="812" y="182">book 版本</text><rect class="main" x="800" y="260" width="270" height="52" rx="4"/><text class="t" x="812" y="282">collection 丛编</text><rect class="main" x="800" y="400" width="270" height="64" rx="4"/><text class="t" x="812" y="422">entity 实体</text><text class="m" x="812" y="440">人物、地名、官职、朝代、年号…</text><rect class="rel" x="800" y="570" width="270" height="56" rx="4"/><text class="t" x="812" y="592">merged_into 墓碑</text><text class="m" x="812" y="610">旧 id → 现行 id</text><path class="er" d="M935 570 V464" marker-end="url(#ar)"/><text class="lab" x="943" y="522">解析到现行</text><rect class="rel" x="480" y="455" width="200" height="58" rx="4" stroke-dasharray="5 4"/><text class="t" x="492" y="477">bt_mention（视图）</text><text class="m" x="492" y="495">实体 × 书 × 章 × 次数</text><rect class="rel" x="480" y="570" width="200" height="58" rx="4"/><text class="t" x="492" y="592">mention 出处反查</text><text class="m" x="492" y="610">书或丛书 × 章；存原始 id</text><line class="e" x1="580" y1="513" x2="580" y2="570" marker-end="url(#a)"/><text class="lab2" x="588" y="546" text-anchor="start">D5 合并口径</text><line class="e" x1="310" y1="80" x2="800" y2="80" marker-end="url(#a)"/><text class="lab2" x="318" y="75" text-anchor="start">item_id ＝ Work id（同一套 id）</text><line class="e" x1="310" y1="98" x2="800" y2="182" marker-end="url(#a)"/><text class="lab2" x="330" y="112" text-anchor="start">或 Book id</text><line class="e" x1="310" y1="345" x2="800" y2="98" marker-end="url(#a)"/><text class="lab2" x="318" y="338" text-anchor="start">work_id / work_ids</text><line class="e" x1="310" y1="362" x2="800" y2="196" marker-end="url(#a)"/><text class="lab2" x="318" y="356" text-anchor="start">book_id / target_bid</text><line class="e" x1="310" y1="378" x2="800" y2="292" marker-end="url(#a)"/><text class="lab2" x="318" y="392" text-anchor="start">collection_id</text><line class="er" x1="310" y1="448" x2="800" y2="424" marker-end="url(#ar)"/><text class="lab" x="560" y="425" text-anchor="start">entity_id（matched 才有）</text><line class="e" x1="310" y1="478" x2="480" y2="484" marker-end="url(#a)"/><text class="lab2" x="318" y="490" text-anchor="start">按实体×书×章计数</text><line class="e" x1="680" y1="476" x2="800" y2="446" marker-end="url(#a)"/><text class="lab2" x="668" y="445" text-anchor="start"></text><line class="er" x1="680" y1="598" x2="800" y2="598" marker-end="url(#ar)"/><text class="lab" x="686" y="591" text-anchor="start">entity_id 原始 id</text><line class="e" x1="680" y1="580" x2="800" y2="200" marker-end="url(#a)"/><text class="lab2" x="748" y="350" text-anchor="start">item_id</text><line class="e" x1="310" y1="560" x2="800" y2="104" marker-end="url(#a)"/><text class="lab2" x="330" y="532" text-anchor="start">work_id（佚书本身）</text><line class="e" x1="310" y1="610" x2="800" y2="110" marker-end="url(#a)"/><text class="lab2" x="330" y="676" text-anchor="start">辑本 / 考证书 / 佚文所出之书</text></svg>